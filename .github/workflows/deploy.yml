
name: Deploy Sandbox to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Checkout playground source
        uses: actions/checkout@v4
        with:
          repository: skmoniri/is-kit-playground
          ref: main
          path: playground

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: Install dependencies
        working-directory: playground
        run: npm ci

      - name: Build sandbox
        working-directory: playground
        env:
          VITE_PARENT_ORIGIN: https://skmoniri.github.io
        run: npm run build:sandbox

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload sandbox
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist-sandbox

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
